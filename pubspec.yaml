name: betto_mediatype_detector
description:
  A Dart package for identifying media types (MIME types) from file content and
  filenames.
version: 0.1.0
repository: https://github.com/bettongia/mediatype_detector
homepage: https://github.com/bettongia/mediatype_detector
issue_tracker: https://github.com/bettongia/mediatype_detector/issues

topics:
  - file-operations

environment:
  sdk: ^3.13.0

# Add regular dependencies here.
dependencies:
  collection: ^1.19.1
  betto_common: ^0.1.0
  path: ^1.9.1
  meta: ^1.18.2
  xml: ^7.0.1
  glob: ^2.1.3

dev_dependencies:
  archive: ^4.0.9
  code_builder: ^4.11.1
  dart_style: ^3.1.9
  http: ^1.6.0
  lints: ^6.0.0
  mustache_template: ^2.0.4
  test: ^1.25.6
  betto_builder_tools: 0.1.0-dev.1
